version: "1.0"
platform: antrobot
require_complete: true

roles:
  deployment:
    classification: configurable
    review_status: approved
    reason: approved deployment and launch interface
  runtime:
    classification: configurable
    review_status: approved
    reason: approved runtime behavior control
  algorithm:
    classification: configurable
    review_status: approved
    reason: approved algorithm tuning control
  hardware:
    classification: configurable
    review_status: approved
    reason: configurable in generic schema and fixed by the physical platform profile
    platform_policy:
      antrobot: fixed
  wiring:
    classification: derived
    review_status: approved
    reason: derived ROS wiring must remain internally consistent
  internal:
    classification: fixed
    review_status: rejected
    reason: hidden implementation or filesystem detail

overrides:
  launch.namespace:
    configuration_role: deployment
    classification: configurable
    review_status: approved
    classification_reason: approved multi-robot deployment namespace
  launch.map:
    configuration_role: deployment
    classification: configurable
    review_status: approved
    classification_reason: approved deployment map selection
  launch.params_file:
    configuration_role: internal
    classification: fixed
    review_status: rejected
    classification_reason: configuration source path is managed by the renderer
