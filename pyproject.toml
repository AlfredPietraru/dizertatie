[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-config-builder"
version = "1.0.0"
description = "Deterministic ROS 2 system-model construction and configuration rendering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1", "pydantic>=2"]

[project.scripts]
ros-config-builder = "ros_config_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ros_config_builder*"]
